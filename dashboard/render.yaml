services:
  - type: web
    name: breakingout
    runtime: node
    repo: https://github.com/tuxcanfly/breakingout.xyz
    branch: master
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/dashboard
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
